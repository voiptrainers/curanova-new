    <style>
      .fab-stack {
        position: fixed;
        right: max(16px, env(safe-area-inset-right));
        bottom: calc(max(20px, env(safe-area-inset-bottom)) + var(--fab-lift, 0px));
        z-index: 50;
        display: flex;
        flex-direction: column;
        gap: 14px;
        transition: opacity 0.25s ease;
      }
      .fab-stack.is-hidden { opacity: 0; pointer-events: none; }
      .fab {
        position: relative;
        display: grid;
        place-items: center;
        width: 56px;
        height: 56px;
        border-radius: 9999px;
        color: #fff;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        -webkit-tap-highlight-color: transparent;
      }
      .fab svg { width: 28px; height: 28px; position: relative; z-index: 1; }
      .fab:hover, .fab:focus-visible { transform: translateY(-2px) scale(1.06); }
      .fab:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
      .fab--whatsapp { background: #25D366; }
      .fab--whatsapp:hover, .fab--whatsapp:focus-visible { box-shadow: 0 10px 26px rgba(37, 211, 102, 0.55); }
      .fab--whatsapp::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: #25D366;
        animation: fab-pulse 2.2s ease-out infinite;
      }
      .fab--instagram {
        background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
      }
      .fab--instagram:hover, .fab--instagram:focus-visible { box-shadow: 0 10px 26px rgba(214, 36, 159, 0.5); }
      .fab__tip {
        position: absolute;
        right: calc(100% + 12px);
        top: 50%;
        transform: translate(6px, -50%);
        white-space: nowrap;
        padding: 6px 12px;
        border-radius: 8px;
        background: #1f1f1f;
        color: #fff;
        font: 500 13px/1.3 "DM Sans", system-ui, sans-serif;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease, transform 0.2s ease;
      }
      .fab:hover .fab__tip, .fab:focus-visible .fab__tip { opacity: 1; transform: translate(0, -50%); }
      @keyframes fab-pulse {
        0% { transform: scale(1); opacity: 0.6; }
        80%, 100% { transform: scale(1.6); opacity: 0; }
      }
      @media (max-width: 640px) {
        .fab { width: 50px; height: 50px; }
        .fab svg { width: 25px; height: 25px; }
        .fab__tip { display: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        .fab, .fab__tip, .fab-stack { transition: none; }
        .fab--whatsapp::before { animation: none; opacity: 0; }
      }
    </style>

    <script>
      // Lift the buttons so they sit above the footer instead of covering it.
      (function () {
        var stack = document.getElementById("fab-stack");
        var queued = false;
        function update() {
          queued = false;
          var footer = document.querySelector("footer");
          var lift = 0;
          if (footer) lift = Math.max(0, window.innerHeight - footer.getBoundingClientRect().top);
          var room = window.innerHeight - lift - stack.offsetHeight - 40;
          stack.style.setProperty("--fab-lift", lift + "px");
          stack.classList.toggle("is-hidden", room < 0);
        }
        function schedule() {
          if (!queued) { queued = true; requestAnimationFrame(update); }
        }
        window.addEventListener("scroll", schedule, { passive: true });
        window.addEventListener("resize", schedule);
        new MutationObserver(schedule).observe(document.getElementById("root"), { childList: true, subtree: true });
        schedule();
      })();
    </script>
